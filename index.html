<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Rose Day Wish 🌹</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
        }

        /* Click Message Button */
        .open-btn {
            padding: 18px 35px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            background: #e60023;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .open-btn:hover {
            transform: scale(1.1);
            background: #c4001d;
        }

        /* Popup Page */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: fadeIn 1s ease;
        }

        .card h1 {
            color: #e60023;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
        }

        .rose {
            font-size: 50px;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #e60023;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Button -->
    <button class="open-btn" onclick="openWish()">Click My Message ❤️</button>

    <!-- Popup Wish -->
    <div class="popup" id="popup">
        <div class="card">
            <div class="rose">🌹</div>
            <h1>Happy Rose Day My Love</h1>
            <p id="wishText">
                My Dear Anand,
                <br><br>
                You are the most special person in my life.
                This rose is a small gift but my love for you is endless.
                Thank you for always being with me.
                <br><br>
                I Love You Forever ❤️
            </p>
            <button class="close-btn" onclick="closeWish()">Close</button>
        </div>
    </div>

    <script>
        function openWish() {
            document.getElementById("popup").style.display = "flex";
        }

        function closeWish() {
            document.getElementById("popup").style.display = "none";
        }
    </script>

</body>

</html>
